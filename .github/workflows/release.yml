name: Release

# Push a tag like v0.9.0 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      # devkitd is cross-compiled for Linux; the UI and Electron app are built for Windows.
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: DevKit-Setup
          path: apps/desktop/release/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          generate_release_notes: true
